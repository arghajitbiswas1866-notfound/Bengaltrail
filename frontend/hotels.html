<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BengalTrail - Choose Your Hotel</title>

    <link
        rel="stylesheet"
        href="hotels.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <header class="hotel-navbar">

        <div class="hotel-logo">
            Bengal<span>Trail</span>
        </div>

        <a href="index.html" class="back-btn">
            ← Back to Trips
        </a>

    </header>


    <main class="hotels-page">

        <section class="hotels-header">

            <span>
                BOOK YOUR STAY
            </span>

            <h1>
                Choose Your Hotel
            </h1>

            <p id="tripRoute">
                Loading trip...
            </p>

        </section>


        <section
            id="hotelsContainer"
            class="hotels-container"
        >

            <div class="loading">

                Loading hotels...

            </div>

        </section>

    </main>


    <script src="hotels.js"></script>

</body>

</html>
